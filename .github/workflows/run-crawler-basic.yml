name: Scheduled Basic Crawler

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-crawler-basic:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    env:
      API_URL: ${{ secrets.API_URL }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Node.js 24 にアップデート

      - name: Install dependencies
        run: npm install

      - name: Prepare .env file
        run: |
          cat <<EOF > .env
          API_URL=${API_URL}
          GIST_TOKEN=${GIST_TOKEN}
          DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
          EOF

      - name: Run crawler
        env:
          MODE: BASIC
          MAX_POST_AGE_MINUTES: 18
          SILENT_MODE: "true"
        run: node --env-file=.env app.js

      - name: Keep-alive (Auto-commit to prevent 60-day inactivity)
        # 1日に1回程度 (実行96回に1回) だけコミットするように制限をかけると履歴が汚れにくいです
        if: github.run_number % 96 == 0
        run: |
          echo "Last successful run: $(date)" > last_run.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.log
          if ! git diff --staged --exit-code --quiet; then
            git commit -m "chore: update execution log [skip ci]"
            git push
          fi
